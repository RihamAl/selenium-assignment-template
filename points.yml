# ============================================================
# Selenium Assignment - Self Assessment
# ============================================================

student:
  website_under_test: "https://www.automationexercise.com/"

# ----------------------------------------------------------
# AI usage
# ----------------------------------------------------------
ai_usage:
  used: true
  tools: "GitHub Copilot"
  description: "Used GitHub Copilot for code assistance, review, refactoring, debugging, and points.yml validation."

# ----------------------------------------------------------
# Quality requirements (gatekeepers)
# ----------------------------------------------------------
quality:
  gitignore:
    done: true
    description: "Unnecessary files are ignored (.gitignore covers build output, IDE files, logs, screenshots, and local config files)"

  structured_code:
    done: true
    description: "Code is organized into test classes, page objects, BasePage, BaseTest, and helper classes"

  readable_code:
    done: true
    description: "Function and method names describe what they do, and test names read like behavior descriptions"

  low_redundancy:
    done: true
    description: "Shared Selenium logic is extracted into BasePage and BaseTest, with locators and actions in page objects"

# ----------------------------------------------------------
# Basic tasks (B)
# ----------------------------------------------------------
basic:
  login_form:
    done: true
    description: "Fill and submit the login form"

  form_with_user:
    done: false
    description: "No separate logged-in-only form is marked, because the implemented contact form does not strictly require login"

  logout:
    done: true
    description: "Log out from the application and verify the login page"

  fill_input:
    count: 10
    description: "Fill login, contact, signup, address, radio, and dropdown fields"

  send_form:
    count: 4
    description: "Submit login, invalid login, contact, and signup/account creation forms"

  static_page_test:
    done: true
    description: "Verify static page content and titles"

  multiple_page_test:
    done: true
    description: "Loop over several public pages and verify expected titles/content"

  complex_xpath:
    count: 10
    description: "Use complex XPath locators with contains(), predicates, nested structure, and multiple levels"

  textarea:
    done: true
    description: "Fill the contact form message textarea"

  dropdown:
    done: true
    description: "Select date and country dropdowns during signup"
    link: "https://www.selenium.dev/documentation/webdriver/support_features/select_lists/"

  radio_button:
    done: true
    description: "Select the title radio button during signup"

  at_least_4_classes:
    done: true
    description: "Project has more than 4 Java classes"

  at_least_6_classes:
    done: true
    description: "Project has more than 6 Java classes"

  at_least_8_classes:
    done: true
    description: "Project has more than 8 Java classes"

  explicit_wait:
    done: true
    description: "Use WebDriverWait with ExpectedConditions in BasePage"
    link: "https://www.selenium.dev/documentation/webdriver/waits/"

  page_title:
    done: true
    description: "Read and verify page titles using getTitle()"

  page_object_pattern:
    done: true
    description: "Use Page Object pattern with separate page classes"
    link: "https://www.selenium.dev/documentation/test_practices/encouraged/page_object_models/"

  base_page_class:
    done: true
    description: "Create a BasePage class that other page classes extend"

  readable_tests:
    done: true
    description: "Test method names describe the behavior being checked"

# ----------------------------------------------------------
# Advanced tasks (A)
# ----------------------------------------------------------
advanced:
  webdriver_config:
    done: true
    description: "Configure ChromeOptions for headless CI execution, window size, no-sandbox, dev-shm, and GPU"
    link: "https://www.selenium.dev/documentation/webdriver/drivers/options/"

  cookie_manipulation:
    done: true
    description: "Add, read, and delete a Selenium cookie"
    link: "https://www.selenium.dev/documentation/webdriver/interactions/cookies/"

  hover_test:
    done: true
    description: "Use Selenium Actions to hover over a product and verify the overlay"
    link: "https://www.selenium.dev/documentation/webdriver/actions_api/mouse/"

  drag_and_drop:
    done: false
    description: "Drag and drop is not implemented"
    link: "https://www.selenium.dev/documentation/webdriver/actions_api/mouse/"

  file_upload:
    done: true
    description: "Upload a temporary text file through the Contact Us file input and submit the form"
    link: "https://www.selenium.dev/documentation/webdriver/elements/file_upload/"

  history_test:
    done: true
    description: "Use browser back() and forward() navigation and verify page titles/URLs"
    link: "https://www.selenium.dev/documentation/webdriver/interactions/navigation/"

  test_dependencies:
    done: false
    description: "Test method dependencies are not implemented"
    link: "https://testng.org/#_test_methods_classes_and_groups"

  email_checking:
    done: false
    description: "Email verification is not implemented"

  random_data:
    done: true
    description: "Generate a unique signup email at runtime for temporary account creation"

  download_files:
    done: false
    description: "File download verification is not implemented"

  config_file:
    done: false
    description: "External config file reading is not implemented"

  javascript_executor:
    done: true
    description: "Use JavascriptExecutor in BasePage to scroll elements into view before interaction"
    link: "https://www.selenium.dev/selenium/docs/api/java/org/openqa/selenium/JavascriptExecutor.html"

  screenshot_on_failure:
    done: false
    description: "Automatic screenshot on failure is not implemented"
    link: "https://www.browserstack.com/guide/take-screenshots-in-selenium"

  headless_execution:
    done: true
    description: "Chrome runs in headless mode"
    link: "https://www.selenium.dev/documentation/webdriver/browsers/chrome/"

  cross_browser_testing:
    done: false
    description: "Cross-browser testing is not implemented"
    link: "https://www.selenium.dev/documentation/webdriver/browsers/"

  dockerized_execution:
    done: false
    description: "Dockerized execution is not implemented"
    link: "https://www.selenium.dev/documentation/grid/getting_started/"
